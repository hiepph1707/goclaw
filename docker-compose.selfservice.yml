# Self-service overlay — adds nginx reverse proxy with SSL termination.
#
# OPTIONAL: The default `latest` image already includes an embedded web dashboard
# served at port 18790. Use this overlay only if you need a dedicated nginx
# reverse proxy for SSL termination, custom caching, or load balancing.
#
# Prerequisites:
#   1. Place SSL certs in ./nginx/ssl/ (fullchain.pem + private.key)
#   2. Update server_name in ./nginx/conf.d/default.conf
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.selfservice.yml up -d
#   # or: make up WITH_WEB_NGINX=1
#
# Dashboard via nginx:
#   HTTP:  http://localhost (redirects to HTTPS)
#   HTTPS: https://localhost

services:
  goclaw-ui:
    image: nginx:stable-alpine
    ports:
      - "${GOCLAW_UI_HTTP_PORT:-80}:80"
      - "${GOCLAW_UI_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - default
      - goclaw-net
    depends_on:
      - goclaw
    restart: unless-stopped
    stop_signal: SIGTERM
