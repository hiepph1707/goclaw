    upstream goclaw-backend {
        server goclaw:18790;
    }

    # HTTP — redirect all to HTTPS
    server {
        listen      80;
        server_name _;  # TODO: replace with your domain, e.g. goclaw.yourdomain.com
        return 301 https://$host$request_uri;

        access_log  /var/log/nginx/goclaw.access.log  main_ext;
        error_log   /var/log/nginx/goclaw.error.log warn;
    }

    # HTTPS — SSL termination + reverse proxy to goclaw
    server {
        listen      443 ssl;
        server_name _;  # TODO: replace with your domain, e.g. goclaw.yourdomain.com

        access_log  /var/log/nginx/goclaw.access.log  main_ext;
        error_log   /var/log/nginx/goclaw.error.log warn;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/private.key;

        # Override default client max body size
        client_max_body_size 50m;

        # WebSocket support (required for goclaw real-time features)
        location /ws {
            proxy_pass http://goclaw-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # API and Web UI
        location / {
            proxy_pass http://goclaw-backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            return 404;
        }
    }
